name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      released: ${{ steps.released.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/select-mode@v2
        id: select
      - name: Check whether this version is already released
        id: released
        run: |
          tag="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2
        with:
          pr-title: Release
          commit-message: Release

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish' && needs.select-mode.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read gateway version
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: node gateway/generate.mjs --environment staging
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/platform-gateway:${{ steps.package.outputs.version }}-staging
      - run: node gateway/generate.mjs --environment production
      - uses: docker/build-push-action@v7
        id: image-production
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/platform-gateway:${{ steps.package.outputs.version }}
      - uses: changesets/action/publish@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm release --no-git-tag
          create-github-releases: false
          push-git-tags: false
      - name: Create repository release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes
      - run: |
          echo "Gateway release: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway image (staging):    ghcr.io/${{ github.repository_owner }}/platform-gateway@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway image (production): ghcr.io/${{ github.repository_owner }}/platform-gateway@${{ steps.image-production.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
