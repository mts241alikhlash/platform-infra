server {
    listen 80;
    server_name HR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name HR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/HR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html/hr;
    index index.html;

    # -------------------------------------------------------- identity
    location ~ ^/(auth|users|profiles|school-units|school-unit-types|religions|blood-types)(/|$) {
        proxy_pass         http://identity_service;
        proxy_http_version 1.1;
