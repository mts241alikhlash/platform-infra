    }

    # ------------------------------------------------------ assessment
    location ~ ^/(assessment-items|assessment-weights|attendances|dashboards|rapors|student-scores)(/|$) {
        proxy_pass         http://assessment_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass_header  Set-Cookie;
    }

    # -------------------------------------------------------- academic
    location ~ ^/(academic-years|classrooms|semesters|subjects|teaching-assignments)(/|$) {
        proxy_pass         http://academic_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass_header  Set-Cookie;
    }

    # --------------------------------------------------------- student
    location ~ ^/(students|student-enrollments)(/|$) {
        proxy_pass         http://student_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass_header  Set-Cookie;
    }

    location /health/identity {
        proxy_pass         http://identity_service/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /health/assessment {
        proxy_pass         http://assessment_service/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /health/academic {
        proxy_pass         http://academic_service/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /health/student {
        proxy_pass         http://student_service/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # -------------------------------------------------------- unrouted
    # None: every prefix this app calls is routed above. The block is omitted
    # rather than emitted empty — an nginx location with no alternation is a
    # syntax error.

    # ---------------------------------------------------------- static
    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The one file that must never be cached: it names the hashed bundles, so
    # a stale copy pins the browser to a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Real files first (favicon, manifest, images); only a path matching
    # nothing on disk reaches @spa.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        # default_type sits here, not inside the if: nginx's rewrite-phase if
        # accepts only return/rewrite/set/break, and default_type inside one is
        # a start-up error. Serving /index.html is unaffected - a static file
        # takes its type from the types map.
        default_type application/json;

        if ($serve_spa_shell = 0) {
            return 404 '{"statusCode":404,"message":"Route not handled by gateway"}';
        }
        try_files /index.html =404;
    }
}

