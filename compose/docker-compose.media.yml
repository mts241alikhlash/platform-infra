name: mts241alikhlash-media

# The exam camera media server. It runs on its own small box, not on the API VPS:
# the production stack already carries 29 images with every service capped at
# 320m, and 30 concurrent streams at ~1.5 Mbps is ~45 Mbps sustained through the
# same host.
#
# Publish: WHIP on 8889. RTMP and SRT were tried first and both opened a socket,
# reported success and sent no media; WHIP is the transport that works. TLS is
# NOT terminated in front of it: the exam app publishes over plain HTTP, and the
# media host is DNS-only in Cloudflare, so no proxy sits in the path.
# Playback: HLS on 8888, TLS terminated by MediaMTX itself so the https
# supervisor page is not blocked as mixed content.
# Recording is off on every path; nothing is stored.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.5
    restart: unless-stopped
    logging: *logging
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "8888:8888"
    environment:
      MTX_RTMP: "no"
      MTX_SRT: "no"
      MTX_RTSP: "no"

      MTX_WEBRTC: "yes"
      MTX_WEBRTCADDRESS: ":8889"
      MTX_WEBRTCENCRYPTION: "no"
      MTX_WEBRTCLOCALUDPADDRESS: ":8189"
      # The app reaches the media host directly, so the browser origin is the
      # only cross-origin caller. "*" together with allow-credentials is an
      # illegal combination that browsers reject.
      MTX_WEBRTCALLOWORIGINS: "https://assessment.mts241alikhlash.sch.id,https://exam.mts241alikhlash.sch.id"

      # Without these MediaMTX advertises 127.0.0.1 and the container's private
      # address as ICE candidates. The phone tries the first one, never reaches
      # the server, and the session dies with "deadline exceeded while waiting
      # connection" even though WHIP answered 201.
      MTX_WEBRTCADDITIONALHOSTS: "media.mts241alikhlash.sch.id"
      MTX_WEBRTCNAT1TO1: "72.62.121.202"
      MTX_WEBRTCIPSFROMINTERFACES: "no"

      MTX_HLS: "yes"
      MTX_HLSADDRESS: ":8888"
      # MediaMTX terminates TLS for HLS itself: the supervisor page is https and
      # Cloudflare does not proxy port 8888, so an http playlist would be both
      # mixed content and unreachable.
      MTX_HLSENCRYPTION: "yes"
      MTX_HLSSERVERCERT: /certs/origin.pem
      MTX_HLSSERVERKEY: /certs/origin.key
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSVARIANT: lowLatency
      MTX_HLSSEGMENTDURATION: 1s
      MTX_HLSALLOWORIGINS: "https://assessment.mts241alikhlash.sch.id,https://exam.mts241alikhlash.sch.id"

      # 2xx allows, anything else denies. See exam-service StreamAuthController.
      MTX_AUTHHTTPADDRESS: http://exam-service:4100/internal/stream-auth
      MTX_AUTHHTTPEXCLUDE: >-
        [{"action":"api"},{"action":"metrics"},{"action":"pprof"}]
      MTX_API: "no"
      MTX_METRICS: "no"
      MTX_PPROF: "no"
      MTX_LOGLEVEL: info
    volumes:
      - /etc/ssl/cloudflare:/certs:ro
    healthcheck:
      # The image ships neither wget nor sh, so the usual HTTP probe cannot run
      # and the container reported unhealthy while serving traffic fine.
      test: ["CMD", "/mediamtx", "--help"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform-net

networks:
  platform-net:
    external: true
    name: mts241alikhlash-net
