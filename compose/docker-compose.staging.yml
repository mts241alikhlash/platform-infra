name: mts241alikhlash-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: "${TRUST_PROXY:-1}"
    NODE_OPTIONS: "--max-old-space-size=256"
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: "no"
  logging: *logging
  entrypoint: ["./node_modules/.bin/prisma"]
  command: ["migrate", "deploy"]
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/platform-gateway@sha256:9dd6faf00c8729d6f3abfed1053ea8b9757621baf0ef64e0f60cfcbc8230262f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:51aa3471f920f03d5f4a782128b3cd948b6c91d3043e8f82e1abb222f11ad919

  admission-web:
