name: mts241alikhlash-staging

x-web-defaults: &web-defaults
  restart: unless-stopped
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    TRUST_PROXY: "1"
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: "no"
  entrypoint: ["./node_modules/.bin/prisma"]
  command: ["migrate", "deploy"]
  networks:
    - platform-net

services:
  gateway:
    image: ghcr.io/mts241alikhlash/platform-gateway@sha256:REPLACE_BEFORE_DEPLOYMENT
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  inventory-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/inventory-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  portal-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/portal-web@sha256:REPLACE_BEFORE_DEPLOYMENT

  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:REPLACE_BEFORE_DEPLOYMENT
    env_file:
      - path: env/identity-service.env
        required: false
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:REPLACE_BEFORE_DEPLOYMENT
    env_file:
      - path: env/academic-service.env
        required: false
    expose:
      - "3200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  inventory-service:
