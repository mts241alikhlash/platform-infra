name: mts241alikhlash-staging

x-web-defaults: &web-defaults
  restart: unless-stopped
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    TRUST_PROXY: "1"
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: "no"
  entrypoint: ["./node_modules/.bin/prisma"]
  command: ["migrate", "deploy"]
  networks:
    - platform-net

services:
  gateway:
    image: ghcr.io/mts241alikhlash/platform-gateway@sha256:72ab9091873740bb3e63827714c3df5cb45aa40b810df2599f07bcb7724a72c9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:89becbaa4f41c1981f340b4cbcaf13bc2d88852e51f55a3757ddaaa038bc732f

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:27f8431a3241f418d29138054e349cd536597ff70ecd321d2003cbf13b6a68cf

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:3167e28ae68febeca0b21b6bedf5a5eac1cf0aeac0755fd78a9ceb7c5a2481f4

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:fce34bb1f136402e7e06b4657fa627592545a0ecc5ea354099fb2958592709a3

  hr-web:
    <<: *web-defaults
