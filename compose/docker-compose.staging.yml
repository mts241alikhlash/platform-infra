      timeout: 5s
      retries: 5
      start_period: 30s

  presence-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/presence-service@sha256:REPLACE_BEFORE_DEPLOYMENT
    env_file:
      - path: env/presence-service.env
        required: false
    expose:
      - "3400"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3400/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:REPLACE_BEFORE_DEPLOYMENT
    env_file:
      - path: env/portal-service.env
