name: 241-platform-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_service
      POSTGRES_USER: mts241alikhlash
      POSTGRES_PASSWORD: mts241alikhlash
    ports:
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ../gateway-source/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts241alikhlash -d identity_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
