name: mts241alikhlash-production

x-web-defaults: &web-defaults
  restart: unless-stopped
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 320m
  environment:
    TRUST_PROXY: "${TRUST_PROXY:-1}"
    NODE_OPTIONS: "--max-old-space-size=256"
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: "no"
  entrypoint: ["./node_modules/.bin/prisma"]
  command: ["migrate", "deploy"]
  networks:
    - platform-net

services:
  gateway:
    image: ghcr.io/mts241alikhlash/platform-gateway@sha256:6bdb7de5ebad60a387a2a4d3e39ad651b14428b40e105336a0df3ca8ca95b39c
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:172d750509a96af058e6e95680844476d3dfb58e361350e4a5a7c5e9716f93ad

  admission-web:
    <<: *web-defaults
