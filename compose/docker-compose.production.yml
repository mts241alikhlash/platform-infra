name: mts241alikhlash-production

x-web-defaults: &web-defaults
  restart: unless-stopped
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    TRUST_PROXY: "1"
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: "no"
  entrypoint: ["./node_modules/.bin/prisma"]
  command: ["migrate", "deploy"]
  networks:
    - platform-net

services:
  gateway:
    image: ghcr.io/mts241alikhlash/platform-gateway@sha256:549a9f65ef0bcb53d39a30afb47485b5a60adb6308ab1e05eb93f9fc17d6380b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:d0b756deabb2293251f49af2c376f2bec6b71892e4fc034dedcf533128cce7d4

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:1d9f19a98abb3e01fc27b7d557537bcfc7e3a0ae492c40f1ab47c0c60c6e280b

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:ab176eb40a39ac04164fb6c41b98a53a221809ff1ea433335a6864e333a66e01

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:db07b05ca64ceefe2648a65e611fc08db36eee996d2c33efd102b8121ac0079b

  hr-web:
