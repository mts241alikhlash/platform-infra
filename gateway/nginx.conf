resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
client_max_body_size 6m;

upstream academic_service {
    zone academic_service 64k;
    server academic-service:3200 resolve;
}

upstream admission_service {
    zone admission_service 64k;
    server admission-service:3700 resolve;
}

upstream assessment_service {
    zone assessment_service 64k;
    server assessment-service:4000 resolve;
}

upstream hr_service {
    zone hr_service 64k;
    server hr-service:3800 resolve;
}

upstream identity_service {
    zone identity_service 64k;
    server identity-service:3000 resolve;
}

upstream inventory_service {
    zone inventory_service 64k;
    server inventory-service:3300 resolve;
}

upstream portal_service {
    zone portal_service 64k;
    server portal-service:3600 resolve;
}

upstream presence_service {
    zone presence_service 64k;
    server presence-service:3400 resolve;
}

upstream student_service {
    zone student_service 64k;
    server student-service:3900 resolve;
}

upstream academic_web {
    zone academic_web 64k;
    server academic-web:8080 resolve;
}

upstream account_web {
    zone account_web 64k;
    server account-web:8080 resolve;
}

upstream admin_web {
    zone admin_web 64k;
    server admin-web:8080 resolve;
}

upstream admission_web {
    zone admission_web 64k;
    server admission-web:8080 resolve;
}

upstream assessment_web {
    zone assessment_web 64k;
    server assessment-web:8080 resolve;
}

upstream hr_web {
    zone hr_web 64k;
    server hr-web:8080 resolve;
}

upstream inventory_web {
    zone inventory_web 64k;
    server inventory-web:8080 resolve;
}

upstream portal_web {
    zone portal_web 64k;
    server portal-web:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_sec_fetch_mode $serve_spa_shell {
    default       1;
    "cors"        0;
    "same-origin" 0;
}

server {
    listen 80;
    server_name dev-accounts.mts241alikhlash.sch.id;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location ~ ^/(auth|blood-types|profiles|religions|sso)(/|$) {
        proxy_pass         http://identity_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
    }

    location = /health/identity {
        proxy_pass         http://identity_service/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass         http://account_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location = /index.html {
        proxy_pass         http://account_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location / {
        if ($serve_spa_shell = 0) {
            return 404 '{"statusCode":404,"message":"Route not handled by gateway"}';
        }
        proxy_pass         http://account_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Set-Cookie;
    }
}

